# ============================================================
# UAV Camera-LiDAR Dataset Configuration
# ============================================================


# ============================================================
# SIMULATION
# ============================================================

simulation:

  random_seed: 42


# ============================================================
# RECORDING
#
# fps:
#
# 全局唯一数据采集频率。
#
# 同时控制：
#
#   CARLA simulation frequency
#   Camera frequency
#   LiDAR rotation frequency
#   Dataset sampling frequency
#
# 当前统一：
#
#   10 Hz
#
#
# num_frames:
#
#   > 0
#       固定录制指定帧数。
#
#   -1
#       自动录制到 UAV 到达路线最后一个 waypoint。
#
#       实际帧数根据：
#
#       route_length
#       UAV speed
#       FPS
#
#       自动计算。
# ============================================================

recording:

  fps: 10

  num_frames: -1


# ============================================================
# TRAFFIC
# ============================================================

traffic:

  enabled: true

  # CARLA 地图 spawn point 数量不足时，
  # 实际车辆数量会自动限制。
  num_vehicles: 80

  tm_port: 8000

  # 在开始 UAV 数据集采集之前，
  # 先让交通车辆运行一段时间。
  #
  # 避免所有车辆刚 spawn 完，
  # 还没有正常进入道路运动状态。
  warmup_seconds: 5.0


# ============================================================
# UAV BODY
#
# CARLA:
#
#   x = forward
#   y = right
#   z = up
#
#
# waypoint 模式：
#
# 实际飞行起点为：
#
#   route.waypoints[0]
#
#
# initial_pose:
#
# 当前主要用于：
#
#   static 模式
#   fallback
#
# ============================================================

uav:

  # UAV 飞行速度
  #
  # 单位：
  #
  # m/s
  #
  # 当前默认：
  #
  # 8 m/s
  speed_mps: 8.0


  initial_pose:

    x: -60.5942
    y: 138.0428
    z: 50.0000

    pitch: 0.0
    yaw: -2.2371
    roll: 0.0


  route_file: "routes/route_01.yaml"


# ============================================================
# SENSOR RIG
# ============================================================

sensors:


  # ==========================================================
  # LiDAR
  #
  # LiDAR 定义为 UAV 原点。
  #
  # LiDAR rotation_frequency 不再写在 YAML。
  #
  # 程序自动：
  #
  # rotation_frequency = recording.fps
  #
  # 当前：
  #
  # 10 Hz
  #
  # 因此一个 CARLA tick 对应一圈 LiDAR。
  # ==========================================================

  lidar:

    position:

      x: 0.0
      y: 0.0
      z: 0.0


    rotation:

      pitch: 0.0
      yaw: 0.0
      roll: 0.0


    channels: 64

    range: 120.0

    points_per_second: 600000

    horizontal_fov: 360.0


    # --------------------------------------------------------
    # Downward LiDAR
    #
    # -89°:
    # 几乎垂直向下
    #
    # -45°:
    # 扫描外围
    #
    # 最终形成向下的圆锥形扫描区域。
    # --------------------------------------------------------

    upper_fov: -45.0

    lower_fov: -89.0


  # ==========================================================
  # RGB CAMERA
  # ==========================================================

  camera:

    # --------------------------------------------------------
    # Camera relative position
    #
    # LiDAR:
    #
    # y = 0.00
    #
    # Camera:
    #
    # y = 0.10
    #
    # Camera-LiDAR baseline:
    #
    # 0.10 m
    # --------------------------------------------------------

    position:

      x: 0.0
      y: 0.10
      z: 0.0


    # --------------------------------------------------------
    # Camera orientation
    #
    # 当前：
    #
    # UAV 前向 + 向下 45°
    # --------------------------------------------------------

    rotation:

      pitch: -45.0
      yaw: 0.0
      roll: 0.0


    # --------------------------------------------------------
    # 如果需要正下视 Camera：
    #
    # rotation:
    #   pitch: -90.0
    #   yaw: 0.0
    #   roll: 0.0
    # --------------------------------------------------------


    width: 1280

    height: 720

    fov: 90.0


# ============================================================
# OUTPUT
# ============================================================

output:

  root: dataset

  save_rgb: true

  save_lidar: true

  save_pose: true
