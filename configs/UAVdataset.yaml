########################## 数据集配置：定义 CARLA 版本和采集参数 ################################

simulation:
  random_seed: 42


########################## 录制：统一采样频率，并设置录制帧数 ################################

recording:
  # fps 同时控制模拟器步长、相机、LiDAR 和数据集采样频率。
  # num_frames 大于 0 时录制指定帧数，-1 时一直录到路线终点。
  fps: 10
  num_frames: -1


########################## 交通：生成和管理车辆、行人及其控制器 ################################

traffic:
  enabled: true

  num_vehicles: 120
  num_pedestrians: 30

  tm_port: 8000

  warmup_seconds: 5.0
  # 录制前先让车辆和行人散开，减少刚生成时的拥挤。

  pedestrian_speed_min_mps: 1.0
  pedestrian_speed_max_mps: 2.0


########################## UAV 设置：定义初始位置、速度和路线 ################################

uav:
  speed_mps: 8.0

  initial_pose:
    x: -60.5942
    y: 138.0428
    z: 50.0000

    pitch: 0.0
    yaw: -2.2371
    roll: 0.0

  route_file: "routes/route_01.yaml"


########################## 传感器安装：定义相机和 LiDAR 的位置与参数 ################################

sensors:

  lidar:
    position:
      x: 0.0
      y: 0.0
      z: 0.0

    rotation:
      pitch: 0.0
      yaw: 0.0
      roll: 0.0

    channels: 128
    range: 120.0
    points_per_second: 600000

    horizontal_fov: 360.0

    upper_fov: -45.0
    lower_fov: -89.0


  camera:
    position:
      x: 0.0
      y: 0.10
      z: 0.0

    rotation:
      pitch: -90.0
      yaw: 0.0
      roll: 0.0

    width: 1280
    height: 720
    fov: 90.0



annotations:
  enabled: true

  # 数据集类别；CARLA 的 van 语义标签与 car 相同，动态车辆会再按蓝图分类。

  classes:
    - car
    - van
    - truck
    - bus
#    - motorcycle
#    - bicycle
#    - pedestrian

  max_distance_m: 120.0

  ########################## 静态地图对象：补充道路场景中不移动的车辆 ################################
  # 静态对象没有动态 ActorID，因此保存投影框和三维框，不保存可见实例框。



  static_environment:
    enabled: true

    classes:
      - car
      - truck
      - bus
#      - motorcycle
#      - bicycle



  lidar_fov_filter:
    enabled: true
    # 第一层几何筛选：目标包围盒至少有一个采样点落入 LiDAR 的量程与视场。
    # 这里本身不判断遮挡，遮挡/可探测性由下面的 lidar_visibility 继续筛选。
    bbox_samples_per_axis: 5



  lidar_visibility:
    enabled: true
    # 动态目标和静态 EnvironmentObject 都必须满足这个真实 LiDAR 点数门槛。
    min_lidar_points: 15



  rgb_visibility_filter:
    enabled: true
    # 动态 Actor 还必须在 instance segmentation 中达到真实可见像素门槛。
    # 动态目标只要 LiDAR < 3 或 RGB visible pixels < 5，就不会写入 labels。
    # 静态 EnvironmentObject 没有可靠 ActorID 像素归属，因此只使用 LiDAR 门槛。
    min_visible_pixels: 15



  bbox3d:
    enabled: true

    # 三维框可保存为世界坐标、LiDAR 坐标和相机坐标。

    save_world: true
    save_lidar: true
    save_camera: true

    # num_lidar_points 由 lidar_visibility 统一统计并写入标注。



  bbox2d:
    enabled: true

    # projected 是几何投影框，visible 是分割图得到的实际可见框。

    projected: true
    visible: true

    # visible bbox 与录制阶段 RGB 硬筛选共用
    # annotations.rgb_visibility_filter.min_visible_pixels。
    near_clip_m: 0.05



  visualization:
    # 调试图中蓝色表示投影三维范围，绿色表示可见实例框。
    save_debug_images: true


########################## 输出：说明数据集目录和生成文件 ################################

output:
  root: dataset

  save_rgb: true
  save_lidar: true
  save_pose: true
  save_labels: true
