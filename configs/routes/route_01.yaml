route:

  name: "route_01"


  ########################## 运行模式：选择固定位置或按航点飞行 ################################
  # 运行模式：static 表示固定位置，waypoints 表示按航点飞行。
  ########################## 朝向：说明机头如何跟随路线方向 ################################

  mode: waypoints


  ########################## 航点列表：第一个点是录制起点，最后一个点是录制终点 ################################
  # 朝向规则：UAV 机头始终朝向当前路线段的下一个航点。

  heading_mode: follow_route


  # 航点按列表顺序使用；第一个是录制起点，最后一个是录制终点。

